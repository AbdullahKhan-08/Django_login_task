<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">My Website</a>
            <div>
                <a href="{% url 'login' %}" class="btn btn-outline-light me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-primary">
                    Register
                </a>
                    <a href="{% url 'logout' %}" class="btn btn-warning">
                    Logut
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="text-center">
            <h1 class="display-4">Welcome Home {{request.user.username}}!</h1>
            <p class="lead">Welcome to our Django Authentication System.</p>

            <a href="{% url 'login' %}" class="btn btn-primary">
                Login
            </a>
            <a href="{% url 'register' %}" class="btn btn-success">
                Create Account
            </a>
        </div>
    </div>

</body>
</html>
